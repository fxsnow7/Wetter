<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f7fd6" id="themeColor">
<title>Wetter</title>
<style>
  :root {
    --ink: #fff; --soft: rgba(255,255,255,.72); --faint: rgba(255,255,255,.18);
    --ease: cubic-bezier(.2,.7,.2,1);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: #0b1020; color: var(--ink); min-height: 100vh; overflow-x: hidden;
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; text-shadow: 0 1px 12px rgba(0,0,0,.12);
  }

  /* Hintergrund */
  .sky { position: fixed; inset: 0; opacity: 0; transition: opacity 1.4s ease; z-index: 0; }
  .sky.on { opacity: 1; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  main {
    position: relative; z-index: 2; max-width: 460px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 36px);
  }

  /* Liquid Glass */
  .glass {
    position: relative; border-radius: 28px;
    background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.07)), rgba(12,26,56,.16);
    -webkit-backdrop-filter: blur(26px) saturate(170%); backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(255,255,255,.08), 0 14px 34px rgba(6,14,40,.2);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.26), transparent 65%);
    opacity: 0; transition: opacity .3s;
  }
  .glass:hover::before { opacity: 1; }

  /* Suche */
  .top { display: flex; gap: 10px; position: relative; z-index: 20; }
  .search { position: relative; flex: 1; min-width: 0; }
  .search input {
    width: 100%; height: 50px; font: inherit; color: var(--ink); border-radius: 25px; padding: 0 52px 0 20px;
    -webkit-appearance: none; appearance: none; outline: none;
    background: linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.1));
    -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
    border: 1px solid rgba(255,255,255,.24); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 10px 26px rgba(6,14,40,.16);
    transition: box-shadow .25s, background .25s;
  }
  .search input::placeholder { color: var(--soft); }
  .search input:focus-visible { box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 2px rgba(255,255,255,.7), 0 10px 26px rgba(6,14,40,.2); }
  .loc {
    position: absolute; right: 5px; top: 5px; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer;
    background: rgba(255,255,255,.18); color: var(--ink); display: grid; place-items: center; transition: transform .2s var(--ease), background .2s;
  }
  .loc:hover { background: rgba(255,255,255,.3); } .loc:active { transform: scale(.9); }
  .loc:focus-visible, .sugg button:focus-visible, #status button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .loc svg { width: 20px; height: 20px; }
  .sugg {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px); margin: 0; padding: 6px; list-style: none; border-radius: 24px;
    background: rgba(24,32,56,.55); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 20px 40px rgba(0,0,0,.3);
    transform-origin: top; animation: pop .22s var(--ease);
  }
  .sugg button {
    display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0;
    padding: 11px 14px; border-radius: 18px; cursor: pointer;
  }
  .sugg button small { display: block; color: var(--soft); font-size: .8rem; }
  .sugg button[aria-selected="true"], .sugg button:hover { background: rgba(255,255,255,.16); }
  .sugg .empty { padding: 14px; color: var(--soft); }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }

  /* Hero */
  .hero { text-align: center; padding: 34px 0 22px; }
  .place { font-size: 1.7rem; font-weight: 500; letter-spacing: -.01em; }
  .temp { font-size: clamp(5.8rem, 25vw, 7.8rem); font-weight: 200; line-height: 1; letter-spacing: -.05em; margin: 2px 0 0 .1em; }
  .heroicon { width: 104px; height: 104px; margin: -4px auto 0; filter: drop-shadow(0 10px 18px rgba(0,0,0,.18)); }
  .desc { font-size: 1.25rem; font-weight: 500; margin-top: 2px; }
  .range { color: var(--soft); margin-top: 3px; font-variant-numeric: tabular-nums; }

  .summary { padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-weight: 500; border-radius: 22px; }
  .summary svg { flex: none; width: 22px; height: 22px; }
  .card { margin-top: 12px; padding: 16px 18px; }
  .card h2, .tile h3 {
    display: flex; align-items: center; gap: 7px; margin: 0 0 12px; font-size: .78rem; font-weight: 600; color: var(--soft);
  }
  .card h2 svg, .tile h3 svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Stunden */
  .hours { display: flex; gap: 6px; overflow-x: auto; margin: 0 -8px; padding: 0 8px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: 0 0 auto; width: 52px; text-align: center; padding: 8px 0 10px; border-radius: 18px; }
  .hour.now { background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  .hour .h { font-size: .8rem; font-weight: 500; }
  .hour .wi { width: 32px; height: 32px; display: block; margin: 5px auto 0; }
  .hour .p { height: 14px; font-size: .7rem; font-weight: 700; color: #c4e7ff; text-shadow: 0 1px 6px rgba(0,30,80,.45); }
  .hour b { font-weight: 500; }

  /* Tage */
  .day { display: grid; grid-template-columns: 52px 32px 34px 34px 1fr 34px; align-items: center; gap: 8px; padding: 9px 0; }
  .day + .day { border-top: 1px solid var(--faint); }
  .day .wi { width: 30px; height: 30px; }
  .day .p { font-size: .72rem; font-weight: 700; color: #c4e7ff; text-shadow: 0 1px 6px rgba(0,30,80,.45); }
  .day .lo { color: var(--soft); text-align: right; font-variant-numeric: tabular-nums; }
  .day .hi { font-variant-numeric: tabular-nums; font-weight: 500; }
  .bar { position: relative; height: 5px; border-radius: 3px; background: rgba(0,0,0,.2); }
  .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #7cd2ff, #ffe27a 70%, #ffb25a); transform: scaleX(0); transform-origin: left; transition: transform 1s .35s var(--ease); }
  .rise.in .fill { transform: scaleX(1); }
  .nowdot { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.25); }

  /* Kacheln */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .tile { padding: 15px 16px 16px; min-height: 158px; display: flex; flex-direction: column; border-radius: 26px; }
  .tile .v { font-size: 1.95rem; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .v { white-space: nowrap; }
  .tile .v small { font-size: .95rem; font-weight: 500; color: var(--soft); letter-spacing: 0; }
  .tile .l { font-weight: 500; margin-top: 2px; }
  .tile p { margin: auto 0 0; padding-top: 10px; font-size: .84rem; color: var(--soft); }
  .meter { position: relative; height: 5px; border-radius: 3px; margin-top: 12px; background: linear-gradient(90deg, #6ee7a8, #ffe27a, #ff9a5a, #ff5a7a, #b46bff); }
  .meter i { position: absolute; top: 50%; left: 0; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.25); transition: left 1.1s .4s var(--ease); }
  .rise.in .meter i { left: var(--p, 0%); }
  .compass { position: relative; width: 50px; height: 50px; margin: 0 0 0 auto; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); flex: none; }
  .compass::after { content: "N"; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: .6rem; font-weight: 700; color: var(--soft); }
  .compass i { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -15px 0 0 -5px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 30px solid rgba(255,255,255,.95); transform: rotate(var(--r, 0deg)); transform-origin: 5px 15px; transition: transform 1.2s .3s var(--ease); filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .arc { width: 100%; height: 46px; margin-top: 8px; overflow: visible; }
  .arc .track { fill: none; stroke: rgba(255,255,255,.3); stroke-width: 2; stroke-dasharray: 3 4; stroke-linecap: round; }
  .arc .sunpt { fill: #ffd54a; filter: drop-shadow(0 0 5px rgba(255,213,74,.9)); }
  .arc line { stroke: rgba(255,255,255,.35); stroke-width: 1.5; }

  .foot { text-align: center; color: var(--soft); font-size: .78rem; margin-top: 22px; }

  #status { text-align: center; color: var(--soft); padding: 110px 0; }
  #status .spin { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: rot .9s linear infinite; }
  #status button { margin-top: 16px; font: inherit; color: var(--ink); cursor: pointer; padding: 10px 20px; border-radius: 22px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.16); }
  @keyframes rot { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }


  /* Extras: Einheit, Merken, Chips */
  .round { flex: none; width: 50px; height: 50px; border-radius: 50%; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer;
    border: 1px solid rgba(255,255,255,.24); background: linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.1));
    -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 10px 26px rgba(6,14,40,.16); transition: transform .2s var(--ease); }
  .round:active { transform: scale(.9); }
  .round:focus-visible, .star:focus-visible, .pill:focus-visible, .chip:focus-visible, .day:focus-visible, .ib:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 0; padding: 2px 16px 4px; scrollbar-width: none; position: relative; z-index: 5; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: inherit; font-size: .88rem; font-weight: 500; color: var(--ink); padding: 7px 14px; border-radius: 18px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.12); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); transition: background .2s, transform .2s; }
  .chip.on { background: rgba(255,255,255,.3); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .chip:active { transform: scale(.94); }
  .placeRow { display: flex; justify-content: center; align-items: center; gap: 8px; }
  .star { width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; transition: transform .25s var(--ease); }
  .star svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; transition: fill .25s, stroke .25s, transform .45s var(--ease); }
  .star[aria-pressed="true"] svg { fill: #ffd54a; stroke: #ffd54a; transform: scale(1.12) rotate(72deg); }
  .star:active { transform: scale(.8); }
  .hint { margin-left: auto; font-weight: 500; font-size: .72rem; opacity: .85; }
  .foot { display: flex; flex-direction: column; align-items: center; }
  .pill { margin-top: 10px; font: inherit; font-size: .85rem; color: var(--ink); cursor: pointer; padding: 8px 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.12); }
  .pill.busy { opacity: .6; pointer-events: none; }
  .pill.busy::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 8px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: rot .8s linear infinite; vertical-align: -1px; }

  /* Tage antippbar */
  .day { margin: 0 -8px; width: calc(100% + 16px); padding: 9px 8px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 14px; transition: background .2s, transform .2s; }
  .day:hover { background: rgba(255,255,255,.08); }
  .day:active { transform: scale(.985); background: rgba(255,255,255,.14); }

  /* Detail-Sheet */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(4,10,24,.45); opacity: 0; transition: opacity .35s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .scrim.open { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 460px; margin: 0 auto; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 32px 32px 0 0; padding: 8px 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,.06)), rgba(14,24,50,.64);
    -webkit-backdrop-filter: blur(36px) saturate(180%); backdrop-filter: blur(36px) saturate(180%);
    border: 1px solid rgba(255,255,255,.22); border-bottom: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 -20px 50px rgba(0,0,0,.3);
    transform: translateY(105%); transition: transform .5s var(--ease); }
  .sheet.open { transform: none; }
  .shHead { touch-action: none; cursor: grab; padding-bottom: 4px; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.4); margin: 4px auto 12px; }
  .shRow { display: flex; align-items: center; gap: 8px; }
  .shRow .ttl { flex: 1; min-width: 0; }
  .shRow h2 { margin: 0; font-size: 1.4rem; font-weight: 600; color: var(--ink); display: block; }
  .shRow .sub { color: var(--soft); font-size: .9rem; }
  .ib { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: var(--ink); cursor: pointer; display: grid; place-items: center; transition: transform .2s, background .2s; }
  .ib:hover { background: rgba(255,255,255,.26); } .ib:active { transform: scale(.88); }
  .ib:disabled { opacity: .3; pointer-events: none; }
  .ib svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .shBody.swap { animation: swapIn .4s var(--ease); }
  @keyframes swapIn { from { opacity: 0; transform: translateX(var(--dx, 16px)); } to { opacity: 1; transform: none; } }
  .shHero { display: flex; align-items: center; gap: 16px; margin: 10px 0 4px; }
  .shHero .wi { width: 88px; height: 88px; flex: none; filter: drop-shadow(0 8px 14px rgba(0,0,0,.2)); }
  .shHero .big { font-size: 2.8rem; font-weight: 300; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .shHero .lo { color: var(--soft); font-size: 1.5rem; margin-left: 8px; }
  .shHero .d { margin-top: 4px; font-weight: 500; }
  .chartRead { min-height: 22px; font-size: .88rem; color: var(--soft); margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
  .chartRead b { color: var(--ink); font-weight: 600; }
  #chartSvg { width: 100%; height: auto; display: block; touch-action: pan-y; overflow: visible; cursor: crosshair; }
  .cline { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
  .carea { opacity: 0; transition: opacity 1s .5s; } .open .carea { opacity: 1; }
  .shGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .shF { border-radius: 20px; padding: 12px 14px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); }
  .shF span { font-size: .75rem; font-weight: 600; color: var(--soft); }
  .shF b { display: block; font-size: 1.3rem; font-weight: 500; margin: 2px 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .shF small { color: var(--soft); font-size: .8rem; }

  /* Eintritts-Animation */
  .rise { opacity: 0; transform: translateY(20px) scale(.985); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .rise.in { opacity: 1; transform: none; }

  /* animierte Wetter-Icons */
  .wi { overflow: visible; }
  .anim .rays { animation: rot 26s linear infinite; }
  .anim .sunb { animation: breathe 3.6s ease-in-out infinite; }
  .anim .cl { animation: drift 7s ease-in-out infinite alternate; }
  .anim .cl2 { animation: drift 9s ease-in-out infinite alternate-reverse; }
  .anim .drop { animation: fall 1.1s linear infinite; }
  .anim .flake { animation: snowfall 3s linear infinite; }
  .anim .bolt { animation: flash 3.4s infinite; }
  .anim .fogl { animation: slide 5s ease-in-out infinite alternate; }
  .anim .moon { animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  @keyframes drift { from { transform: translateX(-2.5px); } to { transform: translateX(2.5px); } }
  @keyframes fall { 0% { transform: translateY(-5px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(9px); opacity: 0; } }
  @keyframes snowfall { 0% { transform: translate(-2px, -5px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(3px, 10px); opacity: 0; } }
  @keyframes flash { 0%, 84%, 100% { opacity: 1; } 86% { opacity: .15; } 88% { opacity: 1; } 91% { opacity: .25; } }
  @keyframes slide { from { transform: translateX(-3px); } to { transform: translateX(3px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rise { opacity: 1; transform: none; } .fill { transform: none; }
  }
</style>
</head>
<body>
<div class="sky" id="skyA"></div>
<div class="sky" id="skyB"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <div class="top">
  <div class="search">
    <input id="q" type="search" placeholder="Stadt suchen" aria-label="Stadt suchen" autocomplete="off" autocapitalize="words" spellcheck="false"
           role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
    <button class="loc" id="locate" type="button" aria-label="Meinen Standort verwenden" title="Meinen Standort verwenden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
    </button>
    <ul class="sugg" id="sugg" role="listbox" hidden></ul>
  </div>
  <button class="round" id="unit" type="button">°C</button>
  </div>
  <div class="chips" id="chips" hidden></div>

  <div id="status"><div class="spin"></div><div id="statusText">Wetter wird geladen …</div></div>

  <div id="app" hidden>
    <section class="hero rise">
      <div class="placeRow"><div class="place" id="place"></div><button class="star" id="fav" type="button" aria-pressed="false" aria-label="Ort merken"><svg viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z"/></svg></button></div>
      <div class="temp" id="temp"></div>
      <div class="heroicon" id="heroicon"></div>
      <div class="desc" id="desc"></div>
      <div class="range" id="range"></div>
    </section>

    <div class="summary glass rise" id="summary"></div>

    <section class="card glass rise">
      <h2><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Stündlich</h2>
      <div class="hours" id="hours"></div>
    </section>

    <section class="card glass rise">
      <h2><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>7-Tage-Vorhersage<span class="hint">Tippen für Details</span></h2>
      <div id="days"></div>
    </section>

    <div class="tiles">
      <section class="tile glass rise">
        <h3><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>UV-Index</h3>
        <div class="v" id="uv"></div><div class="l" id="uvL"></div>
        <div class="meter" id="uvM"><i></i></div><p id="uvT"></p>
      </section>
      <section class="tile glass rise">
        <h3><svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg>Wind</h3>
        <div class="row"><div><div class="v" id="wind"></div><div class="l" id="windD"></div></div><div class="compass" id="compass"><i></i></div></div>
        <p id="gust"></p>
      </section>
      <section class="tile glass rise">

      case "cloud": s = cloudG(16, 1, .75, "#aab6c6", "cl2") + cloudG(4, 12, 1, day ? "#f4f7fb" : "#cfd8e6"); break;

  /* ================= Himmel (Farbverlauf) ================= */
  var PAL = {
    clear:  { day: ["#2a74c9", "#4a95de", "#7fbbe9"], dusk: ["#3a4a94", "#c2698c", "#f7a76c"], night: ["#060c22", "#131f4a", "#2a3d78"] },

    rain:   { day: ["#2f3e52", "#47596f", "#63798f"], dusk: ["#2b3447", "#4a5268", "#6c6f80"], night: ["#0d121c", "#182134", "#27344b"] },
    snow:   { day: ["#4b6682", "#6e8aa5", "#93adc2"], dusk: ["#3e4b6a", "#76809c", "#b093a0"], night: ["#192338", "#2b3a56", "#465b7c"] },
    storm:  { day: ["#1b1f2e", "#2c3147", "#464b66"], dusk: ["#1b1f2e", "#2c3147", "#464b66"], night: ["#0b0d17", "#171a2b", "#2a2e45"] },
    fog:    { day: ["#5c6873", "#78848f", "#98a3ad"], dusk: ["#4a5360", "#78727e", "#a3948f"], night: ["#1a1f26", "#2a313a", "#3c4650"] }
  };
  function palFor(kind, phase) {
    var g = ({ clear: "clear", partly: "clear", cloud: "cloud", fog: "fog", drizzle: "rain", rain: "rain", heavy: "rain", snow: "snow", storm: "storm" })[kind] || "cloud";
    return PAL[g][phase];
  }
  var skyFlip = false;

    next.classList.add("on"); prev.classList.remove("on");
    $("themeColor").setAttribute("content", p[0]);
  }

  /* ================= Canvas-Effekte ================= */

      if (s.kind === "storm" || s.kind === "heavy" || s.kind === "rain") { rgb = "52,64,86"; a = .42; }
      else if (!s.day) { rgb = "125,140,178"; a = .24; }
      else if (s.kind === "fog") { rgb = "255,255,255"; a = .3; }
      else { rgb = "255,255,255"; a = .32; }
      var count = ({ clear: 0, partly: 3, cloud: 6, fog: 5, drizzle: 6, rain: 7, heavy: 8, snow: 6, storm: 8 })[s.kind] || 0;
      for (i = 0; i < count; i++) {
        if (s.kind === "fog") { rw = w * rand(1.2, 1.7); rh = rand(180, 280); }
        else { rw = Math.min(w, 720) * rand(.8, 1.4); rh = rw * rand(.3, .42); }

      }
      if (!s.day && (s.kind === "clear" || s.kind === "partly" || s.kind === "cloud")) {
        n = ({ clear: 120, partly: 60, cloud: 22 })[s.kind];
        for (i = 0; i < n; i++) P.stars.push({ x: rand(0, w), y: rand(0, h * .72), r: rand(.4, 1.4), ph: rand(0, 6.28), sp: rand(.8, 2.2) });
      }
      if (s.kind === "drizzle" || s.kind === "rain" || s.kind === "heavy" || s.kind === "storm") {

      }

        n = Math.min(180, Math.round(w * h / 11000 * s.intensity));

    function makeBolt() {
      var x = rand(w * .15, w * .85), y = 0, pts = [[x, y]], endY = h * rand(.35, .55);

    };

      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      void path.getBoundingClientRect();
      path.style.transition = "stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1)"; path.style.strokeDashoffset = 0;
    }
  }
  function fillSheet(k, dir) {
    var D = lastD.daily, t = D.time[k], code = D.weather_code[k], i;
    var long = new Date(t + "T12:00:00");
    $("shTitle").textContent = k === 0 ? "Heute" : k === 1 ? "Morgen" : long.toLocaleDateString("de-DE", { weekday: "long" });
    $("shSub").textContent = long.toLocaleDateString("de-DE", { day: "numeric", month: "long" });
    $("shIcon").innerHTML = icon(kindOf(code), true, true);
    $("shHi").textContent = deg(D.temperature_2m_max[k]); $("shLo").textContent = deg(D.temperature_2m_min[k]);
    $("shDesc").textContent = TXT[code] || "–";
    $("shRain").textContent = num(D.precipitation_sum[k] || 0, 1) + " mm";
    $("shRainT").textContent = "Risiko " + (D.precipitation_probability_max ? D.precipitation_probability_max[k] : 0) + " %";
    var wm = D.wind_speed_10m_max ? D.wind_speed_10m_max[k] : null, gm = D.wind_gusts_10m_max ? D.wind_gusts_10m_max[k] : null;
    $("shWind").textContent = wm == null ? "–" : Math.round(wm) + " km/h"; $("shWindT").textContent = gm == null ? "" : "Böen bis " + Math.round(gm) + " km/h";
    var uv = D.uv_index_max ? D.uv_index_max[k] : 0;
    $("shUv").textContent = num(uv, 0); $("shUvT").textContent = uvLabel(uv);
    var a = mins(D.sunrise[k]), b = mins(D.sunset[k]), len = b - a;
    $("shSun").textContent = hm(D.sunrise[k]) + " – " + hm(D.sunset[k]);
    $("shSunT").textContent = Math.floor(len / 60) + " Std " + (len % 60) + " Min hell";
    $("shPrev").disabled = k <= 0; $("shNext").disabled = k >= D.time.length - 1;
    drawChart(k);
    if (dir) {
      var body = $("shBody"); body.style.setProperty("--dx", (dir > 0 ? 18 : -18) + "px");
      body.classList.remove("swap"); void body.offsetWidth; body.classList.add("swap");
    }
  }
  function openSheet(k, trigger) {
    if (!lastD) return;
    lastFocus = trigger || document.activeElement; sheetK = k; fillSheet(k, 0);
    var sh = $("sheet"), sc = $("scrim"); sh.hidden = false; sc.hidden = false; void sh.offsetWidth;
    sh.classList.add("open"); sc.classList.add("open"); document.body.style.overflow = "hidden";
    sh.scrollTop = 0; $("shClose").focus({ preventScroll: true });
  }
  function closeSheet() {
    if (sheetK < 0) return;
    sheetK = -1; var sh = $("sheet"), sc = $("scrim");
    sh.classList.remove("open"); sc.classList.remove("open"); sh.style.transform = ""; document.body.style.overflow = "";
    setTimeout(function () { if (sheetK < 0) { sh.hidden = true; sc.hidden = true; } }, 450);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function stepSheet(dir) {
    var nk = sheetK + dir; if (sheetK < 0 || nk < 0 || nk > lastD.daily.time.length - 1) return;
    sheetK = nk; tick(); fillSheet(nk, dir);
  }
  $("shClose").addEventListener("click", closeSheet); $("scrim").addEventListener("click", closeSheet);
  $("shPrev").addEventListener("click", function () { stepSheet(-1); }); $("shNext").addEventListener("click", function () { stepSheet(1); });
  document.addEventListener("keydown", function (e) {
    if (sheetK < 0) return;
    if (e.key === "Escape") closeSheet(); else if (e.key === "ArrowLeft") stepSheet(-1); else if (e.key === "ArrowRight") stepSheet(1);
  });
  (function () {   // Sheet nach unten wischen zum Schließen
    var head = $("shHead"), sh = $("sheet"), y0 = 0, dy = null;
    head.addEventListener("pointerdown", function (e) { if (e.target.closest("button")) return; y0 = e.clientY; dy = 0; sh.style.transition = "none"; head.setPointerCapture(e.pointerId); });
    head.addEventListener("pointermove", function (e) { if (dy == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = "translateY(" + dy + "px)"; });
    function end() { if (dy == null) return; sh.style.transition = ""; if (dy > 90) closeSheet(); else sh.style.transform = ""; dy = null; }
    head.addEventListener("pointerup", end); head.addEventListener("pointercancel", end);
  })();

  /* ================= Merken, Einheit, Aktualisieren ================= */
  function tick() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }
  var favs = restore("wetter-favs"); if (!Array.isArray(favs)) favs = [];
  function keyOf(p) { return p.lat.toFixed(2) + "," + p.lon.toFixed(2); }
  function isFav(p) { return favs.some(function (f) { return keyOf(f) === keyOf(p); }); }
  function renderChips() {
    var box = $("chips"); box.textContent = ""; box.hidden = !favs.length;
    favs.forEach(function (f) {
      var b = el("button", "chip" + (current && keyOf(f) === keyOf(current) ? " on" : ""), f.name); b.type = "button";
      b.addEventListener("click", function () { tick(); load(f); });
      box.appendChild(b);
    });
  }
  function updateFav() {
    var on = !!(lastPlace && isFav(lastPlace)), b = $("fav");
    b.setAttribute("aria-pressed", on ? "true" : "false"); b.setAttribute("aria-label", on ? "Ort nicht mehr merken" : "Ort merken");
    renderChips();
  }
  $("fav").addEventListener("click", function () {
    if (!lastPlace) return; tick();
    if (isFav(lastPlace)) favs = favs.filter(function (f) { return keyOf(f) !== keyOf(lastPlace); });
    else { favs.push({ name: lastPlace.name, lat: lastPlace.lat, lon: lastPlace.lon }); if (favs.length > 8) favs.shift(); }
    store("wetter-favs", favs); updateFav();
  });
  function paintUnit() { $("unit").textContent = "°" + unit; $("unit").setAttribute("aria-label", "Einheit " + (unit === "C" ? "Celsius" : "Fahrenheit") + ", tippen zum Wechseln"); }
  $("unit").addEventListener("click", function () {
    tick(); unit = unit === "C" ? "F" : "C"; store("wetter-unit", unit); paintUnit();
    if (lastD) render(lastPlace, lastD, true, true);
    if (sheetK >= 0) fillSheet(sheetK, 0);
  });
  $("refresh").addEventListener("click", function () { if (!current) return; tick(); this.classList.add("busy"); load(current, true); });
  paintUnit(); renderChips();

  /* ================= Start ================= */
  var saved = restore("wetter-ort");
  if (saved && typeof saved.lat === "number") load(saved); else locate();
})();
</script>
